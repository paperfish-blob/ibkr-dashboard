<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realized P&amp;L</title>
<!-- Vendored, not CDN: this dashboard reads cached data and should keep
     working when the network does not. Chart.js v4.5.1, MIT. -->
<script src="/static/vendor/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --line: #232c38;
    --text: #e6edf3;
    --muted: #8b949e;
    --pos: #3fb950;
    --neg: #f85149;
    --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-block: 40px;
    padding-inline: 20px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  .account { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; margin-bottom: 16px; }

  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .headline {
    font-size: clamp(40px, 9vw, 64px);
    font-weight: 650;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
  }
  .today { margin-top: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }

  .chart-box { position: relative; height: 300px; }
  @media (max-width: 560px) { .chart-box { height: 220px; } }

  footer { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px;
    font-size: 12px; color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--pos); }
  .dot.off { background: #6e7681; }

  .alert {
    border: 1px solid var(--warn); background: rgba(210,153,34,.09);
    color: var(--warn); border-radius: 10px; padding: 12px 16px;
    margin-bottom: 16px; font-size: 13px;
  }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 13px; }
  .hidden { display: none !important; }

  /* Transaction ledger */
  .tx-summary { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .tx-range { color: var(--muted); font-size: 12px; }
  .tx-total { font-weight: 650; font-variant-numeric: tabular-nums; }

  .day-header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 0 8px; margin-top: 6px;
    border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 12px;
  }
  .day-header:first-of-type { margin-top: 2px; }
  .day-total { font-weight: 650; font-variant-numeric: tabular-nums; font-size: 13px; }

  .trade-row {
    display: flex; justify-content: space-between; gap: 14px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .trade-row:last-child { border-bottom: none; }
  .trade-left { min-width: 0; }
  .trade-symbol-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .trade-symbol { font-weight: 650; }
  .trade-tag { color: var(--muted); font-size: 11px; }
  .trade-category { color: var(--muted); font-size: 12px; }
  .trade-side-line { font-size: 13px; }
  .trade-side.buy { color: #58a6ff; }
  .trade-side.sell { color: var(--neg); }
  .trade-order { color: var(--muted); font-size: 12px; }

  .trade-fill {
    text-align: right; flex: 0 0 auto; min-width: 96px;
    font-variant-numeric: tabular-nums;
  }
  .trade-price { font-weight: 600; }
  .trade-amount, .trade-commission { color: var(--muted); font-size: 12px; }

  .trade-outcome {
    text-align: right; flex: 0 0 auto; min-width: 76px;
    font-variant-numeric: tabular-nums;
  }
  .trade-time { color: var(--muted); font-size: 12px; }
  .trade-pnl { font-weight: 650; }
  .trade-pnl.neutral { color: var(--muted); font-weight: 500; }

  .tx-filter {
    display: inline-flex; border: 1px solid var(--line); border-radius: 999px;
    padding: 2px; gap: 2px; flex: 0 0 auto;
  }
  .tx-filter button {
    border: none; background: transparent; color: var(--muted);
    font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 999px;
    cursor: pointer;
  }
  .tx-filter button.active { background: var(--line); color: var(--text); }

  @media (max-width: 620px) {
    .trade-row { flex-wrap: wrap; }
    /* A row of unbroken numbers ("$71,829.52") can force the whole page
       wider than the viewport if it isn't allowed to wrap or shrink. */
    .trade-fill {
      text-align: left; order: 3; flex-basis: 100%;
      display: flex; flex-wrap: wrap; gap: 4px 14px; min-width: 0;
    }
    .trade-fill > div { min-width: 0; }
    .trade-outcome { order: 2; }
  }

  .load-more {
    display: block; width: 100%; margin-top: 12px;
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    color: var(--muted); padding: 10px; font-size: 13px; cursor: pointer;
  }
  .load-more:hover { border-color: #364152; color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Realized P&amp;L</h1>
    <span class="account" id="account"></span>
  </header>

  <div class="alert hidden" id="alert"></div>

  <div class="panel">
    <div class="label" id="headline-label">Total realized</div>
    <div class="headline" id="headline">—</div>
    <div class="today" id="today"></div>
  </div>

  <div class="panel">
    <div class="label">Cumulative</div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
    <div class="empty hidden" id="empty">No realizing trades in this statement period.</div>
  </div>

  <div class="panel">
    <div class="tx-summary">
      <div>
        <div class="label" style="margin-bottom:2px;">Transactions</div>
        <div class="tx-range" id="tx-range"></div>
      </div>
      <div class="tx-filter" id="tx-filter">
        <button type="button" data-filter="all" class="active">All trades</button>
        <button type="button" data-filter="realized">Realized only</button>
      </div>
      <div class="tx-total" id="tx-total"></div>
    </div>
    <div id="tx-list"></div>
    <div class="empty hidden" id="tx-empty">No realizing trades in this statement period.</div>
    <button class="load-more hidden" id="tx-load-more">Show more</button>
  </div>

  <footer>
    <span class="badge"><span class="dot" id="gw-dot"></span><span id="gw-text">Gateway —</span></span>
    <span class="badge"><span class="dot" id="flex-dot"></span><span id="flex-text">Flex —</span></span>
    <span class="badge" id="source-badge">Today from —</span>
  </footer>
</div>

<script>
const REFRESH_MS = 30000;
let chart = null;

const fmtMoney = (value, currency) =>
  new Intl.NumberFormat("en-US", {
    style: "currency", currency: currency || "USD",
    minimumFractionDigits: 2, maximumFractionDigits: 2,
    signDisplay: "exceptZero",
  }).format(value);

const fmtDay = (iso) =>
  new Date(iso + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });

const fmtFullDate = (iso) =>
  new Date(iso + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

const fmtQty = (q) => new Intl.NumberFormat("en-US").format(Math.abs(Number(q)));

const fmtNum = (value, maxFrac) =>
  new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: maxFrac }).format(value);

// Prices need variable precision (Intl's currency style forces a fixed
// fraction count), so the symbol is prefixed by hand instead.
const CURRENCY_SYMBOLS = { USD: "$", EUR: "€", GBP: "£", JPY: "¥" };
const fmtPriceLike = (value, currency, maxFrac) =>
  (CURRENCY_SYMBOLS[currency] || currency + " ") + fmtNum(value, maxFrac);

const fmtTime = (iso) =>
  iso ? new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "never";

const signClass = (n) => (n < 0 ? "neg" : "pos");

function renderChart(series, currency) {
  const canvas = document.getElementById("chart");
  const empty = document.getElementById("empty");

  const showMessage = (text) => {
    canvas.style.display = "none";
    empty.textContent = text;
    empty.classList.remove("hidden");
  };

  if (!series.length) {
    showMessage("No realizing trades in this statement period.");
    return;
  }
  // Say what actually went wrong rather than falling through to the
  // empty state, which would claim there is no data when there is.
  if (typeof Chart === "undefined") {
    showMessage("Chart library failed to load — the figures above are still correct.");
    return;
  }
  canvas.style.display = "";
  empty.classList.add("hidden");

  const labels = series.map((p) => fmtDay(p.date));
  const values = series.map((p) => Number(p.cumulative));
  const last = values[values.length - 1];
  const negative = last < 0;
  const colour = negative ? "#f85149" : "#3fb950";

  const ctx = canvas.getContext("2d");
  // Rebuilt on every render so the fill tracks the sign along with the line.
  const gradient = () => {
    const rgb = negative ? "248,81,73" : "63,185,80";
    const g = ctx.createLinearGradient(0, 0, 0, canvas.height || 300);
    g.addColorStop(0, `rgba(${rgb},.22)`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    return g;
  };

  if (chart) {
    chart.data.labels = labels;
    chart.data.datasets[0].data = values;
    chart.data.datasets[0].borderColor = colour;
    chart.data.datasets[0].backgroundColor = gradient();
    chart.update("none");
    return;
  }

  const fill = gradient();

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: colour,
        backgroundColor: fill,
        borderWidth: 2,
        fill: true,
        tension: 0.2,
        pointRadius: 0,
        pointHoverRadius: 4,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (item) => fmtMoney(item.parsed.y, currency),
          },
        },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: "#8b949e", maxTicksLimit: 8 } },
        y: {
          grid: { color: "#232c38" },
          ticks: {
            color: "#8b949e",
            callback: (v) => new Intl.NumberFormat("en-US", { notation: "compact" }).format(v),
          },
        },
      },
    },
  });
}

function render(data) {
  const headline = Number(data.headline);
  const today = Number(data.today);

  const headlineEl = document.getElementById("headline");
  headlineEl.textContent = fmtMoney(headline, data.currency);
  headlineEl.className = "headline " + signClass(headline);

  document.getElementById("today").innerHTML =
    data.today_source === "none"
      ? "No realized P&amp;L today."
      : `Today <span class="${signClass(today)}">${fmtMoney(today, data.currency)}</span>`;

  document.getElementById("account").textContent = data.account_id || "";

  // Gateway badge
  const gwDot = document.getElementById("gw-dot");
  const gw = data.gateway;
  gwDot.className = "dot " + (gw.connected ? "live" : "off");
  document.getElementById("gw-text").textContent = gw.connected
    ? `Gateway live · ${fmtTime(gw.updated_at)}`
    : "Gateway disconnected";

  // Flex badge
  const flexDot = document.getElementById("flex-dot");
  flexDot.className = "dot " + (data.flex_ok ? "live" : "off");
  document.getElementById("flex-text").textContent = data.flex_ok
    ? `Flex · ${fmtTime(data.flex_fetched_at)} · ${data.trade_count} trades`
    : "Flex unavailable";

  document.getElementById("source-badge").textContent = "Today from " + data.today_source;

  // Warnings: a stale/expired token must not read as a genuine zero.
  const alert = document.getElementById("alert");
  const problems = [data.flex_error, data.currency_warning].filter(Boolean);
  if (problems.length) {
    alert.textContent = problems.join(" — ");
    alert.classList.remove("hidden");
  } else {
    alert.classList.add("hidden");
  }

  renderChart(data.series, data.currency);
}

const DAYS_PER_PAGE = 20;
let txDaysAll = [];   // every day, every execution -- as the server sent it
let txDays = [];      // the currently filtered view of the above
let txShown = 0;
let txCurrency = "USD";
let txFilter = "all"; // "all" | "realized" -- "all" is the default

function tradeRow(t) {
  const row = document.createElement("div");
  row.className = "trade-row";

  const side = (t.buy_sell || "").toUpperCase();
  const sideLabel = side === "BUY" ? "Bought" : side === "SELL" ? "Sold" : (t.buy_sell || "");
  const sideClass = side === "BUY" ? "buy" : side === "SELL" ? "sell" : "";

  const orderBits = [t.order_type, t.notes_codes].filter(Boolean).join(" · ");

  const left = document.createElement("div");
  left.className = "trade-left";
  left.innerHTML = `
    <div class="trade-symbol-line">
      <span class="trade-symbol">${t.symbol}</span>
      ${t.exchange ? `<span class="trade-tag">${t.exchange}</span>` : ""}
    </div>
    ${t.asset_category ? `<div class="trade-category">${t.asset_category}</div>` : ""}
    <div class="trade-side-line">
      <span class="trade-side ${sideClass}">${sideLabel}</span> ${fmtQty(t.quantity)}
    </div>
    ${orderBits ? `<div class="trade-order">${orderBits}</div>` : ""}
  `;

  const fill = document.createElement("div");
  fill.className = "trade-fill";
  fill.innerHTML = `
    ${t.trade_price != null ? `<div class="trade-price">${fmtPriceLike(Number(t.trade_price), t.currency, 4)}</div>` : ""}
    ${t.trade_money != null ? `<div class="trade-amount">${fmtPriceLike(Number(t.trade_money), t.currency, 2)}</div>` : ""}
    ${t.commission ? `<div class="trade-commission">${fmtPriceLike(Math.abs(Number(t.commission)), t.currency, 2)}</div>` : ""}
  `;

  const outcome = document.createElement("div");
  outcome.className = "trade-outcome";
  // realized_pnl (fifoPnlRealized) is what IBKR's own apps display here --
  // checked against a real account's whole-statement total; commission is
  // shown separately, not netted into this figure. An opening trade has no
  // P&L yet (is_realizing is false) -- shown as a plain dash, not a colored
  // $0.00, so it doesn't read as a break-even close.
  const pnlHtml = t.is_realizing
    ? `<div class="trade-pnl ${signClass(Number(t.realized_pnl))}">${fmtMoney(Number(t.realized_pnl), t.currency)}</div>`
    : `<div class="trade-pnl neutral">—</div>`;
  outcome.innerHTML = `
    ${t.trade_time ? `<div class="trade-time">${t.trade_time}</div>` : ""}
    ${pnlHtml}
  `;

  row.append(left, fill, outcome);
  return row;
}

function renderTxPage() {
  const list = document.getElementById("tx-list");
  const moreBtn = document.getElementById("tx-load-more");

  const slice = txDays.slice(txShown, txShown + DAYS_PER_PAGE);
  const fragment = document.createDocumentFragment();

  for (const day of slice) {
    const header = document.createElement("div");
    header.className = "day-header";
    header.innerHTML = `
      <span>${fmtFullDate(day.date)}</span>
      <span class="day-total ${signClass(Number(day.total_pnl))}">${fmtMoney(Number(day.total_pnl), txCurrency)}</span>
    `;
    fragment.appendChild(header);
    for (const t of day.trades) fragment.appendChild(tradeRow(t));
  }

  list.appendChild(fragment);
  txShown += slice.length;
  moreBtn.classList.toggle("hidden", txShown >= txDays.length);
}

function applyTxFilter() {
  const list = document.getElementById("tx-list");
  const empty = document.getElementById("tx-empty");
  const moreBtn = document.getElementById("tx-load-more");

  list.innerHTML = "";
  txShown = 0;

  // "Realized only" hides opening trades client-side and drops any day left
  // with nothing in it (a day of opens only nets to $0, so it would render
  // as an empty header with no rows under it otherwise). A day's total_pnl
  // does not need recomputing either way -- an opening trade contributes 0.
  txDays =
    txFilter === "realized"
      ? txDaysAll
          .map((day) => ({ ...day, trades: day.trades.filter((t) => t.is_realizing) }))
          .filter((day) => day.trades.length > 0)
      : txDaysAll;

  const allTrades = txDays.flatMap((d) => d.trades);
  const tradeCount = allTrades.length;

  document.getElementById("tx-range").textContent = tradeCount
    ? `${tradeCount} trade(s) · ${fmtDay(txDays[txDays.length - 1].date)} – ${fmtDay(txDays[0].date)}`
    : "";

  const totalEl = document.getElementById("tx-total");
  const total = allTrades.reduce((sum, t) => sum + Number(t.realized_pnl), 0);
  if (tradeCount) {
    totalEl.textContent = fmtMoney(total, txCurrency);
    totalEl.className = "tx-total " + signClass(total);
  } else {
    totalEl.textContent = "";
  }

  if (!txDays.length) {
    empty.classList.remove("hidden");
    moreBtn.classList.add("hidden");
    return;
  }
  empty.classList.add("hidden");
  renderTxPage();
}

function renderTransactions(data) {
  txDaysAll = data.days || [];
  txCurrency = txDaysAll[0]?.trades?.[0]?.currency || "USD";
  applyTxFilter();
}

document.getElementById("tx-load-more").addEventListener("click", renderTxPage);

document.getElementById("tx-filter").addEventListener("click", (e) => {
  const button = e.target.closest("button[data-filter]");
  if (!button || button.classList.contains("active")) return;
  document.querySelectorAll("#tx-filter button").forEach((b) => b.classList.remove("active"));
  button.classList.add("active");
  txFilter = button.dataset.filter;
  applyTxFilter();
});

async function tickTransactions() {
  try {
    const response = await fetch("/api/transactions");
    if (!response.ok) throw new Error("HTTP " + response.status);
    renderTransactions(await response.json());
  } catch (err) {
    // The headline/chart panel already reports API failures; a second
    // identical alert here would just be noise.
  }
}

function showFatal(message) {
  const alert = document.getElementById("alert");
  alert.textContent = message;
  alert.classList.remove("hidden");
}

async function tick() {
  let data;
  // Fetching and rendering are reported separately: a rendering bug
  // must not be blamed on the API, which is what makes such a message
  // impossible to act on.
  try {
    const response = await fetch("/api/pnl");
    if (!response.ok) throw new Error("HTTP " + response.status);
    data = await response.json();
  } catch (err) {
    showFatal("Could not reach the dashboard API: " + err.message);
    return;
  }

  try {
    render(data);
  } catch (err) {
    showFatal("Failed to render: " + err.message);
  }
}

tick();
tickTransactions();
setInterval(tick, REFRESH_MS);
setInterval(tickTransactions, REFRESH_MS);
</script>
</body>
</html>
